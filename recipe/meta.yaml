{% set name = "pyflakes" %}
{% set version = "4.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 592beb57058eb82eb190fb7514f2081c555c51000b029ff71286a681e6cf2f83

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pyflakes = pyflakes.api:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - pyflakes
    - pyflakes.api
    - pyflakes.checker
    - pyflakes.messages
    - pyflakes.reporter
    - pyflakes.scripts
    - pyflakes.test.harness
    - pyflakes.test.test_imports
    - pyflakes.test.test_other
    - pyflakes.test.test_undefined_names
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pyflakes --help
    - pytest --pyargs pyflakes.test -vv

about:
  home: https://github.com/PyCQA/pyflakes
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Pyflakes analyzes programs and detects various errors.
  description: |
    Pyflakes analyzes programs and detects various errors. It works by parsing
    the source file, not importing it, so it is safe to use on modules with side
    effects. It is also much faster.
  dev_url: https://github.com/PyCQA/pyflakes
  doc_url: https://pypi.org/project/pyflakes/

extra:
  recipe-maintainers:
    - jakirkham
    - sigmavirus24
    - dopplershift
    - ocefpaf
