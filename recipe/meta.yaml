{% set name = "pyflakes" %}
{% set version = "4.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 492b27735181e3d4a6acfc08738948b666bf3e696781854ea6e0d8540d566d52

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pyflakes = pyflakes.api:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - pyflakes
    - pyflakes.api
    - pyflakes.checker
    - pyflakes.messages
    - pyflakes.reporter
    - pyflakes.scripts
    - pyflakes.test.harness
    - pyflakes.test.test_imports
    - pyflakes.test.test_other
    - pyflakes.test.test_undefined_names
  requires:
    - pip
  commands:
    - pip check
    - pyflakes --help

about:
  home: https://github.com/PyCQA/pyflakes
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Pyflakes analyzes programs and detects various errors.
  description: |
    Pyflakes analyzes programs and detects various errors. It works by parsing
    the source file, not importing it, so it is safe to use on modules with side
    effects. It is also much faster.
  dev_url: https://github.com/PyCQA/pyflakes
  doc_url: https://pypi.org/project/pyflakes/

extra:
  recipe-maintainers:
    - jakirkham
    - sigmavirus24
    - dopplershift
    - ocefpaf
